services:
  airflow:
    build: .
    environment:
      AIRFLOW__CORE__PARALLELISM: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.airflow:/opt/airflow
      - ./data:/app/data
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - warehouse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  permissoes-metabase:
    image: postgres:16
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/configurar-leitura.sh:/configurar-leitura.sh:ro
    entrypoint: ["/bin/sh", "/configurar-leitura.sh"]
  metabase:
    image: metabase/metabase@sha256:06b66bf50d5b46ad632a836aeb62149eaab768033f9d3dae72ad4b10e6427590
    depends_on:
      permissoes-metabase:
        condition: service_completed_successfully
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - metabase:/metabase-data

volumes:
  warehouse:
  metabase:
